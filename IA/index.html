<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Intranet escolar para docentes, personal, estudiantes y familias.">
    <title>Intranet Escolar</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- ======== Login ======== -->
    <div id="vista-login" class="vista-login" hidden>
        <div class="fondo-dinamico fondo-dinamico--login" aria-hidden="true"></div>

        <form id="form-login" class="tarjeta tarjeta--login" novalidate>
            <div class="emblema emblema--login" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6L21 10.18V15h2V9L12 3zM7 15.91V13.1L12 15.5l5-2.4v2.81L12 18.3l-5-2.39z"/>
                </svg>
            </div>
            <h1 class="titulo-login">Intranet Escolar</h1>
            <p id="login-titulo-rol" class="subtitulo">Elige tu acceso para continuar</p>

            <div class="selector-rol" role="group" aria-label="Tipo de acceso">
                <button type="button" class="selector-rol__opcion" data-rol-login="docente">Docentes / Personal</button>
                <button type="button" class="selector-rol__opcion" data-rol-login="estudiante">Estudiantes / Familias</button>
            </div>
            <input type="hidden" id="login-rol" name="rol">

            <div class="campo">
                <label for="login-usuario">Usuario</label>
                <input type="text" id="login-usuario" name="usuario" autocomplete="username" required>
            </div>

            <div class="campo">
                <label for="login-clave">Contraseña</label>
                <input type="password" id="login-clave" name="clave" autocomplete="current-password" required>
            </div>

            <p id="login-error" class="alerta alerta--error" role="alert" hidden></p>

            <button type="submit" class="boton boton--primario boton--amplio">Ingresar</button>
        </form>
    </div>

    <!-- ======== Aplicación ======== -->
    <div id="vista-app" hidden>
        <div class="fondo-dinamico" aria-hidden="true"></div>

        <header class="cabecera">
            <div class="cabecera__superior">
                <div class="cabecera__marca">
                    <svg class="cabecera__emblema" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor" d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6L21 10.18V15h2V9L12 3zM7 15.91V13.1L12 15.5l5-2.4v2.81L12 18.3l-5-2.39z"/>
                    </svg>
                    <div class="cabecera__texto">
                        <p class="cabecera__titulo">Intranet Escolar</p>
                        <p id="cabecera-rol" class="cabecera__rol"></p>
                    </div>
                </div>

                <div class="cabecera__usuario">
                    <p class="cabecera__contexto">
                        <span id="cabecera-saludo" class="cabecera__saludo"></span>
                        <span id="cabecera-fecha" class="cabecera__fecha"></span>
                    </p>
                    <span id="cabecera-nombre" class="cabecera__nombre"></span>
                    <button id="boton-salir" class="boton boton--secundario boton--en-cabecera" type="button">Salir</button>
                </div>
            </div>

        </header>

        <div class="estructura-app">
            <nav class="navegacion" aria-label="Navegación principal">
                <p class="navegacion__titulo">Panel</p>
                <ul id="menu" class="menu"></ul>
            </nav>
            <main id="contenido" class="contenido"></main>
        </div>

        <p id="estado-sistema" class="estado-sistema" role="status" aria-live="polite" hidden></p>

        <footer class="pie">
            <p>Escuela N.º 12 · Intranet Escolar — proyecto de demostración con datos ficticios</p>
        </footer>
    </div>

    <script src="js/utilidades.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/vistas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
